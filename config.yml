# Main settings only. Command text/settings: config/commands/. Server automation: config/guilds/.
runtime:
    intents:
        - Guilds
        - GuildMessages
        - MessageContent
        - GuildMembers
        - GuildVoiceStates
        - GuildMessageReactions
        - GuildInvites
        - GuildModeration
    message_cache_limit: 100
    owner_ids: []
hot_reload:
    enabled: true
    debounce_ms: 150
    write_stability_ms: 250
    polling: false
    polling_interval_ms: 500
health:
    interval_ms: 300000
colors:
    default: '#ff1493'
    success: '#00ff00'
    error: '#ff0000'
    info: '#0099ff'
status:
    texts:
        - 🚀 Running the new update!
        - 💡 Created by Skypixel
        - ✨ Discover the new update!
        - ⚙️ Managing {servers} servers
        - 👥 Assisting {members} members
        - ⏱️ Online for {uptime}
    type: Custom
    url: https://thelunarpackvr.carrd.co/
    status: idle
    interval_ms: 30000
limits:
    message: 2000
    flips: 10
    e621_results: 100
    meme_cache: 50
messages:
    environmentVariablesNotSet: Environment variables TOKEN or clientId not set.
    errorLoggingIn: 'Error logging in: '
    common:
        permission_denied:
            - ❌ You do not have permission to do that.
            - 🚫 Missing permission for this action.
            - ⚠️ You lack the required permission.
        try_again_later:
            - Please try again later.
            - Give it another shot in a moment.
            - Try again shortly.
logging:
    quiet_startup: false
    listener_max: 64
api:
    refresh_on_start: true
    registration: global
    guild_id: ''
    sync_debounce_ms: 1500
    retry_ms: 10000
database:
    path: database.json
    auto_repair: true
ui:
    accent: '#ff1493'
    footer: 'Puro • Skypixel'
    timestamps: false
    auto_embeds: true
    validate_payloads: true
    help_page_size: 8
    session_minutes: 15
    max_sessions: 2000
features:
    feedback:
        enabled: true
        channel_id: ''
        max_file_bytes: 8388608
    scheduled_events:
        enabled: true
    user_install:
        enabled: false
